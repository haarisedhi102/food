[project]
name = "food"
version = "0.1.0"
description = "Virtual fridge & pantry: track Kroger + Costco purchases and know when perishables go bad"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openai>=1.54",
    "playwright>=1.48",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "rich>=13.9",
    "tenacity>=9.0",
]

[project.scripts]
food = "food.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["food"]

[tool.pytest.ini_options]
testpaths = ["tests"]
