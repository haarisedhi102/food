[package]
name = "rig_poc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rig = { version = "0.45.0", default-features = false, features = ["reqwest", "rustls", "typesafeai"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = "0.34"

[profile.release]
lto = "thin"
