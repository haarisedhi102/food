name: RigPoCiOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
targets:
  RigPoCiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../swift/generated/rig_poc.swift
    info:
      path: Sources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - framework: ../swift/artifacts/RigPoc.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RigPoCiOS
