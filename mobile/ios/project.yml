name: FoodCapture
options:
  bundleIdPrefix: ai.commandcode.food
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FoodCore:
    path: FoodCore

schemes:
  FoodCapture:
    build:
      targets:
        FoodCapture: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  FoodCapture:
    type: application
    platform: iOS
    sources:
      - path: FoodCapture
    dependencies:
      - package: FoodCore
    info:
      path: FoodCapture/Info.plist
      properties:
        CFBundleDisplayName: Food Capture
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: ai.commandcode.food.capture
            CFBundleURLSchemes:
              - foodcapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.commandcode.food.capture
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # Sign with the user's team so physical-device runs work; the simulator ignores signing.
        DEVELOPMENT_TEAM: 4XANTCF7HL
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: YES
        Release:
          CODE_SIGNING_ALLOWED: YES
