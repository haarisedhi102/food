<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Virtual Fridge &amp; Pantry{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-semibold text-lg">🧊 Fridge &amp; Pantry</a>
      <nav class="flex gap-4 text-sm text-slate-600">
        <a href="/" class="hover:text-slate-900">Shelves</a>
        <a href="/chat" class="hover:text-slate-900">Ask</a>
      </nav>
      <span class="ml-auto text-xs text-slate-400">{{ today if today else '' }}</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-8 text-xs text-slate-400">
    Shelf-life guidance from USDA FoodKeeper (public domain).
    Canonicalization by Command Code models.
  </footer>
</body>
</html>
